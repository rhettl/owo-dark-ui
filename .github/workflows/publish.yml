name: Publish to GitHub Packages

on:
  push:
    branches: [main]         # publishes a SNAPSHOT on every main-branch push
    tags: ['v*']             # publishes a release on version tags (e.g. v1.0.0)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine publish version
        id: version
        run: |
          BASE=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release: strip the leading 'v' from the tag (v1.0.0 → 1.0.0)
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Snapshot: append -SNAPSHOT to the property value
            VERSION="${BASE}-SNAPSHOT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: ./gradlew build publish -Pmod_version=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}